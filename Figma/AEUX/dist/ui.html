<div id="app">

    <transition name="lift">
        <div class="footer" v-show="footerMsg" :class="footerType">
            <div class="count">
                {{ count }}
            </div>
            {{ footerMsg }}
        </div>
    </transition>

    <a class="help" href="https://aeux.io" target="_blank">
        <svg width="12" height="12" viewBox="0 0 24 24">
            <path fill="none" d="M0 0h24v24H0z" />
            <path
                d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z" />
        </svg>
    </a>

    <div class="group">
        <div class="title">Actions</div>
        <div class="button"
            :class="{thinking: thinking}"
            @click="exportSelection($event)">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12,16L19.36,10.27L21,9L12,2L3,9L4.63,10.27M12,18.54L4.62,12.81L3,14.07L12,21.07L21,14.07L19.37,12.8L12,18.54Z" />
            </svg>
            <div>Send selection to Ae</div>
        </div>
        <div class="button"
            title="Send all fill colors from selection to the AEUX panel in Ae"
            @click="exportPalette">
            <svg viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
            <div>Send color palette to Ae</div>
        </div>
    </div>

    <div class="group">
        <div class="title">Options</div>
        <div class="button"
            @click="prefs.exportRefImage = !prefs.exportRefImage; setPrefs('exportRefImage')">
            <svg viewBox="0 0 24 24" v-if="prefs.exportRefImage">
                <path 
                    d="M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V5H19V19M17,17H7V7H17V17Z" />
            </svg>
            <svg viewBox="0 0 24 24" v-else>
                <path
                    d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,5V19H5V5H19Z" />
            </svg>
            <div>Export reference image</div>
        </div>
        
        <div class="button"
            title="Send a rasterized image of the parent frame without any layers"
            @click="sendRefImageOnly">
            <svg viewBox="0 0 24 24">
                <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
            </svg>
            <div>Send reference image only</div>
        </div>

        <div class="button"
            title="Adds * to layer names"
            @click="addRasterizeFlag">
            <svg viewBox="0 0 24 24">
                <path
                    d="M21 13H14.4L19.1 17.7L17.7 19.1L13 14.4V21H11V14.3L6.3 19L4.9 17.6L9.4 13H3V11H9.6L4.9 6.3L6.3 4.9L11 9.6V3H13V9.4L17.6 4.8L19 6.3L14.3 11H21V13Z" />
            </svg>
            <div>Rasterize layer on export</div>
        </div>
        <div class="button"
            title="Check selection for import issues"
            @click="validateSelection">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <div>Check selection</div>
        </div>
    </div>
    <div class="version">
        v{{version}}
    </div>

    <!-- <div id="export-selection" 
        class="button big" 
        :class="{thinking: thinking}" 
        @click="exportSelection($event)">
        <svg v-show="thinking !== 'fetchAEUX'" fill="#000000" viewBox="0 0 24 24" width="24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
                d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z" />
        </svg>
    
        <svg v-show="thinking == 'fetchAEUX'" class="spinner" width="65px" height="65px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
            <circle class="path" fill="none" stroke-width="6" stroke-linecap="round" cx="33" cy="33" r="30"></circle>
        </svg>
        <div class="message">
            {{(!thinking) ? 'Send selection to Ae' : btnMsg}}
        </div>
    </div>

    <div class="checkbox">
        <input type="checkbox" class="option-checkbox" id="exportRefImage" v-model="prefs.exportRefImage" @click="setPrefs('exportRefImage')">
        <label for="exportRefImage">Export reference image</label>
    </div>

    <div class="button text" @click="addRasterizeFlag" title="Add * to layer names">
        <div>
            Import as PNG
        </div>

    </div>     -->
    
</div>
